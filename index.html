<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160907">
  <title>I LOVE TACOS 🔥</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden; color: #fff7e8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(ellipse at 50% 75%, #7b210b 0%, #351006 36%, #160907 75%);
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .2;
      background: repeating-linear-gradient(115deg, transparent 0 38px, #ff6a1a12 39px 41px);
    }
    header { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 25px 7vw; border-bottom: 1px solid #ffb15a30; }
    .brand { font-weight: 1000; letter-spacing: .16em; font-size: 14px; color: #ffb34d; }
    .nav { color: #ffd9ad; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    main { position: relative; z-index: 1; min-height: 78vh; display: grid; place-items: center; text-align: center; padding: 70px 20px 90px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px; border: 1px solid #ff9d3d70; border-radius: 999px; color: #ffbf70; font-size: 11px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; background: #ff7a1a12; }
    h1 { margin: 25px 0 10px; font-size: clamp(64px, 12vw, 142px); line-height: .82; letter-spacing: -.085em; font-weight: 1000; text-transform: uppercase; text-shadow: 0 8px 45px #ff4d0b55; }
    h1 span { display: block; color: #ff8b28; }
    .taco { margin: 28px 0 18px; font-size: clamp(100px, 19vw, 210px); line-height: 1; filter: drop-shadow(0 15px 35px #ff4b1590); animation: bob 3s ease-in-out infinite; }
    .sub { max-width: 520px; margin: 0 auto; color: #f3c9a3; font-size: 17px; line-height: 1.7; }
    .button { display: inline-block; margin-top: 30px; padding: 15px 25px; border-radius: 999px; background: linear-gradient(100deg, #ffb02e, #ff5524); color: #260b04; text-decoration: none; font-size: 12px; font-weight: 1000; letter-spacing: .13em; text-transform: uppercase; box-shadow: 0 8px 35px #ff5b1b55; transition: transform .2s, box-shadow .2s; }
    .button:hover { transform: translateY(-3px); box-shadow: 0 12px 45px #ff5b1b90; }
    footer { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 15px; padding: 22px 7vw; border-top: 1px solid #ffb15a30; color: #d99b70; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
    @media (max-width: 600px) { header { padding: 20px 6vw; } main { min-height: 78vh; padding: 60px 18px; } footer { padding: 20px 6vw; flex-wrap: wrap; } }
    @media (prefers-reduced-motion: reduce) { .taco { animation: none; } html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">🔥 TACO FEVER</div>
    <div class="nav">Hot · Fresh · Legendary</div>
  </header>
  <main>
    <div>
      <div class="eyebrow">🌶️ Officially obsessed</div>
      <h1>I LOVE <span>TACOS</span></h1>
      <div class="taco" aria-label="Taco">🌮</div>
      <p class="sub">Life is better with a little spice. Crunchy, cheesy, saucy perfection — tacos are always the answer.</p>
      <a class="button" href="https://en.wikipedia.org/wiki/Taco">Taco appreciation club ↗</a>
    </div>
  </main>
  <footer><span>Made with 🔥 and extra salsa</span><span>100% taco energy</span></footer>
</body>
</html>
