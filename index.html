<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f5f7ff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at 50% 0%, #24345f 0, #111a32 42%, #090d18 100%);
    }
    main { width: min(680px, 100%); text-align: center; }
    .tag { display: inline-block; padding: 8px 13px; border: 1px solid #ffffff24; border-radius: 999px; color: #aebfff; font-size: 13px; }
    h1 { margin: 24px 0 12px; font-size: clamp(42px, 8vw, 72px); letter-spacing: -0.06em; }
    p { margin: 0 auto; max-width: 490px; color: #b7c0d5; font-size: 18px; line-height: 1.65; }
    a { display: inline-block; margin-top: 30px; padding: 13px 20px; border-radius: 12px; background: #8298ff; color: #0a1022; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="tag">YOUR WEBSITE IS LIVE</span>
    <h1>Hello, world.</h1>
    <p>This is your first website deployed from GitHub. Change the code, push an update, and your site can publish automatically through Cloudflare Pages.</p>
    <a href="https://github.com/jovandordevic1406/Tests-project">View the GitHub repository</a>
  </main>
</body>
</html>
